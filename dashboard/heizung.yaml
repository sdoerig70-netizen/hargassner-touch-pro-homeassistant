title: Heizung
views:
- title: Übersicht
  path: uebersicht
  icon: mdi:fire
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Kessel
      icon: mdi:fire
    - type: gauge
      entity: sensor.musteranlage_kessel_kesseltemperatur
      name: Kesseltemperatur
      min: 0
      max: 100
      needle: true
      segments:
      - from: 0
        color: '#4fa3e0'
      - from: 55
        color: '#f0a030'
      - from: 65
        color: '#43a047'
      - from: 92
        color: '#e53935'
    - type: tile
      entity: sensor.musteranlage_kessel_zustand
      name: Zustand
    - type: tile
      entity: sensor.musteranlage_kessel_leistung
      name: Leistung
      icon: mdi:gauge
    - type: tile
      entity: sensor.musteranlage_kessel_abgastemperatur
      name: Abgas
      icon: mdi:smoke
    - type: tile
      entity: sensor.musteranlage_messkanale_kessel_rucklauf_temperatur_ist
      name: Rücklauf
      icon: mdi:thermometer-chevron-down
    - type: tile
      entity: sensor.musteranlage_messkanale_kessel_sauerstoffgehalt_ist
      name: Restsauerstoff
      icon: mdi:molecule
    - type: tile
      entity: sensor.musteranlage_kessel_aussentemperatur
      name: Aussen
      icon: mdi:sun-thermometer-outline
    - type: tile
      entity: select.musteranlage_kessel_pr001_kesselprogramm
      name: PR001 Kesselprogramm
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: binary_sensor.musteranlage_cloud_verbindung
      name: Cloud
      icon: mdi:cloud-check
  - type: grid
    cards:
    - type: heading
      heading: Puffer
      icon: mdi:storage-tank
    - type: gauge
      entity: sensor.musteranlage_puffer_pufferladung
      name: Pufferladung
      min: 0
      max: 100
      needle: true
      segments:
      - from: 0
        color: '#e53935'
      - from: 20
        color: '#f0a030'
      - from: 45
        color: '#43a047'
    - type: tile
      entity: sensor.musteranlage_puffer_puffertemperatur_oben
      name: Oben
      icon: mdi:thermometer-high
    - type: tile
      entity: sensor.musteranlage_puffer_puffertemperatur_mitte
      name: Mitte
      icon: mdi:thermometer
    - type: tile
      entity: sensor.musteranlage_puffer_puffertemperatur_unten
      name: Unten
      icon: mdi:thermometer-low
    - type: tile
      entity: sensor.musteranlage_puffer_zustand
      name: Zustand
    - type: tile
      entity: binary_sensor.musteranlage_puffer_pumpe_aktiv
      name: Pumpe
      icon: mdi:pump
    - type: tile
      entity: sensor.musteranlage_puffer_hochste_anforderung
      name: Höchste Anforderung
  - type: grid
    cards:
    - type: heading
      heading: Heizkreis 1 (Altbau)
      icon: mdi:radiator
    - type: thermostat
      entity: climate.musteranlage_heizkreis_1_altbau
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
    - type: tile
      entity: sensor.musteranlage_heizkreis_1_altbau_zustand
      name: Zustand
    - type: tile
      entity: binary_sensor.musteranlage_heizkreis_1_altbau_pumpe_aktiv
      name: Pumpe
      icon: mdi:pump
    - type: tile
      entity: sensor.musteranlage_heizkreis_1_altbau_vorlauftemperatur
      name: Vorlauf
    - type: tile
      entity: sensor.musteranlage_heizkreis_1_altbau_vorlauf_solltemperatur
      name: Vorlauf Soll
    - type: tile
      entity: select.musteranlage_heizkreis_1_altbau_pr011_betriebsart
      name: Betriebsart
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: number.musteranlage_heizkreis_1_altbau_4_tages_raumtemperatur
      name: 4 Tages-Raumtemperatur
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
    - type: tile
      entity: number.musteranlage_heizkreis_1_altbau_5_absenk_raumtemperatur
      name: 5 Absenk-Raumtemperatur
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
  - type: grid
    cards:
    - type: heading
      heading: Heizkreis 2 (Neubau)
      icon: mdi:radiator
    - type: thermostat
      entity: climate.musteranlage_heizkreis_2_neubau
