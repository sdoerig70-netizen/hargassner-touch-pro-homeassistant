      name: Zustand
    - type: tile
      entity: binary_sensor.musteranlage_heizkreis_2_neubau_pumpe_aktiv
      name: Pumpe
      icon: mdi:pump
    - type: tile
      entity: sensor.musteranlage_heizkreis_2_neubau_vorlauftemperatur
      name: Vorlauf
    - type: tile
      entity: sensor.musteranlage_heizkreis_2_neubau_vorlauf_solltemperatur
      name: Vorlauf Soll
    - type: tile
      entity: select.musteranlage_heizkreis_2_neubau_pr012_betriebsart
      name: Betriebsart
      features:
      - type: select-options
      features_position: bottom
    - type: tile
      entity: number.musteranlage_heizkreis_2_neubau_7_tages_raumtemperatur
      name: 7 Tages-Raumtemperatur
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
    - type: tile
      entity: number.musteranlage_heizkreis_2_neubau_8_absenk_raumtemperatur
      name: 8 Absenk-Raumtemperatur
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
  - type: grid
    cards:
    - type: heading
      heading: Frischwasserstation (Neubau)
      icon: mdi:water-boiler
    - type: tile
      entity: sensor.musteranlage_frischwasserstation_1_neubau_auslauf_solltemperatur
      name: Auslauf Soll
    - type: tile
      entity: sensor.musteranlage_frischwasserstation_1_neubau_vorlauftemperatur
      name: Vorlauf
    - type: tile
      entity: sensor.musteranlage_messkanale_neubau_fws_fuhler_fws_1
      name: FWS-Fühler
      icon: mdi:thermometer-water
    - type: tile
      entity: binary_sensor.musteranlage_frischwasserstation_1_neubau_pumpe_aktiv
      name: Pumpe
      icon: mdi:pump
    - type: tile
      entity: sensor.musteranlage_frischwasserstation_1_neubau_zapfmenge_heute
      name: Zapfmenge heute
      icon: mdi:water
    - type: tile
      entity: sensor.musteranlage_frischwasserstation_1_neubau_zapfmenge_gesamt
      name: Zapfmenge gesamt
      icon: mdi:water-plus
  - type: grid
    cards:
    - type: heading
      heading: Wetter (Oberaach)
      icon: mdi:weather-partly-cloudy
    - type: tile
      entity: sensor.musteranlage_temperatur
      name: Temperatur
    - type: tile
      entity: sensor.musteranlage_zustand
      name: Wetter
      icon: mdi:weather-cloudy
    - type: tile
      entity: sensor.musteranlage_luftfeuchtigkeit
      name: Feuchte
    - type: tile
      entity: sensor.musteranlage_windgeschwindigkeit
      name: Wind
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Verlauf 24 Stunden
      icon: mdi:chart-line
    - type: history-graph
      title: Kessel
      hours_to_show: 24
      entities:
      - sensor.musteranlage_kessel_kesseltemperatur
      - sensor.musteranlage_messkanale_kessel_rucklauf_temperatur_ist
      - sensor.musteranlage_kessel_abgastemperatur
    - type: history-graph
      title: Puffer
      hours_to_show: 24
      entities:
      - sensor.musteranlage_puffer_puffertemperatur_oben
      - sensor.musteranlage_puffer_puffertemperatur_mitte
      - sensor.musteranlage_puffer_puffertemperatur_unten
    - type: history-graph
      title: Vorlauf Heizkreise
      hours_to_show: 24
      entities:
      - sensor.musteranlage_heizkreis_1_altbau_vorlauftemperatur
      - sensor.musteranlage_heizkreis_2_neubau_vorlauftemperatur
      - sensor.musteranlage_kessel_aussentemperatur
    - type: history-graph
      title: Kesselzustand
      hours_to_show: 24
      entities:
      - sensor.musteranlage_kessel_zustand
- title: Heizkurve
  path: heizkurve
  icon: mdi:chart-bell-curve-cumulative
  type: panel
  cards:
  - type: custom:hargassner-heizkurve-card
    titel: Heizkurve
    aussen: sensor.musteranlage_kessel_aussentemperatur_gemittelt
    aussen_aktuell: sensor.musteranlage_kessel_aussentemperatur
    prognose: sensor.musteranlage_prognose
    abschaltgrenze: number.musteranlage_heizkreis_1_altbau_11_alle_heizkreise_aus_uber_aussentemperatur
    tage: 7
    heizkreise:
    - name: Heizkreis 1 (Altbau)
      farbe: '#e8743b'
      steilheit: number.musteranlage_heizkreis_1_altbau_a2_steilheit
      tagestemperatur: number.musteranlage_heizkreis_1_altbau_4_tages_raumtemperatur
      absenktemperatur: number.musteranlage_heizkreis_1_altbau_5_absenk_raumtemperatur
      witterung: select.musteranlage_heizkreis_1_altbau_a5b_witterungsfuhrung
      vorlauf_soll: sensor.musteranlage_heizkreis_1_altbau_vorlauf_solltemperatur
      vorlauf_ist: sensor.musteranlage_heizkreis_1_altbau_vorlauftemperatur
    - name: Heizkreis 2 (Neubau)
      farbe: '#3b8ee8'
      steilheit: number.musteranlage_heizkreis_2_neubau_a12_steilheit
      tagestemperatur: number.musteranlage_heizkreis_2_neubau_7_tages_raumtemperatur
      absenktemperatur: number.musteranlage_heizkreis_2_neubau_8_absenk_raumtemperatur
      witterung: select.musteranlage_heizkreis_2_neubau_a15b_witterungsfuhrung
      vorlauf_soll: sensor.musteranlage_heizkreis_2_neubau_vorlauf_solltemperatur
      vorlauf_ist: sensor.musteranlage_heizkreis_2_neubau_vorlauftemperatur
- title: Einstellungen
